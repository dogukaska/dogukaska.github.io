ListenAddress = "0.0.0.0"
ListenPort = 8080
MaxFileSizeStr = "15GB"
MaxUserSizeStr = "100GB"
MaxFilePerUpload = 1000
DefaultTTLStr = "3d"
MaxTTLStr = "7d"
FeatureAuthentication = "forced"
FeatureLocalLogin = "enabled"
FeatureApiTokens = "enabled"
FeatureSetTTL = "enabled"
FeatureExtendTTL = "disabled"
FeatureRemovable = "disabled"
FeatureOneShot = "disabled"
FeatureStream = "disabled"
EnableArchiveCompression = false
DefaultAdminLogin = "admin"

DataBackend = "file"
[DataBackendConfig]
    Directory = "/data/files"

[MetadataBackendConfig]
    Driver = "sqlite3"
    ConnectionString = "/data/plik.db"
