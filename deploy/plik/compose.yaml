services:
  storage:
    image: rootgg/plik:1.4.3
    user: "0:0"
    command: ["chown", "1000:1000", "/data"]
    volumes:
      - transfers:/data

  plik:
    image: rootgg/plik:1.4.3
    restart: unless-stopped
    depends_on:
      storage:
        condition: service_completed_successfully
    volumes:
      - ./plikd.cfg:/home/plik/server/plikd.cfg:ro
      - transfers:/data

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    environment:
      PLIK_DOMAIN: ${PLIK_DOMAIN:?Set the public Plik hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data

volumes:
  transfers:
  certificates:
