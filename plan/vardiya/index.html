<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vardiyayı Takvime Aktar · Dijital Çakı</title>
<meta name="description" content="Döngüyü oluştur, günleri kontrol et ve takvim dosyasını indir.">
<link rel="icon" href="/icons/dijital-caki.svg">
<link rel="stylesheet" href="/tool.css?v=20261126d">
<link rel="stylesheet" href="/gunluk/style.css?v=1">
<script src="/theme.js?v=20261126c"></script>
<script type="module" src="app.js?v=1"></script>
</head>
<body>
<main class="tool daily">
<header>
  <a class="back" href="/#plan">Uygulamalar</a>
  <h1>Vardiyayı Takvime Aktar</h1>
  <p class="intro">Döngüyü oluştur, günleri kontrol et ve takvim dosyasını indir.</p>
</header>
<section class="panel">
  <div class="fields">
    <label>İlk gün<input id="start" type="date"></label>
    <label>Gün sayısı<input id="days" type="number" min="1" max="366" value="30"></label>
  </div>
  <label>Döngü
    <input id="cycle" value="G G N N İ İ İ İ" maxlength="160" autocapitalize="characters">
  </label>
  <p class="muted">G gündüz, N gece, İ izin. Aralarına boşluk koy. Örneğin G G N N İ İ.</p>
  <details>
    <summary>Vardiya saatleri</summary>
    <div class="fields">
      <label>Gündüz başlangıç<input id="day-start" type="time" value="08:00"></label>
      <label>Gündüz bitiş<input id="day-end" type="time" value="20:00"></label>
      <label>Gece başlangıç<input id="night-start" type="time" value="20:00"></label>
      <label>Gece bitiş<input id="night-end" type="time" value="08:00"></label>
    </div>
  </details>
</section>
<section class="panel">
  <h2>Önizleme</h2>
  <p class="muted">Tek bir günü değiştirmek için yanındaki seçimi düzenle. Saatler Türkiye saatidir.</p>
  <ul id="preview" class="clean scroll"></ul>
  <button id="export" type="button" class="primary">Takvim dosyasını indir</button>
  <p id="status" role="status"></p>
</section>
</main>
</body>
</html>
